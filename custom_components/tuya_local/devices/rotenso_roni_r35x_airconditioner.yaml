name: Air conditioner
products:
  - id: nn2ooaacswz6uyi0
    manufacturer: Rotenso
    model: Roni R35X [R18]
    model_id: e1k5wioo
entities:
  - entity: climate
    translation_key: aircon_extra
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: "0"
                value: heat_cool
              - dps_val: "1"
                value: cool
              - dps_val: "2"
                value: dry
              - dps_val: "3"
                value: fan_only
              - dps_val: "4"
                value: heat
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 1600
          max: 3100
        mapping:
          - scale: 100
            step: 50
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - scale: 100
      - id: 4
        type: string
        name: mode
        hidden: true  # control via hvac_mode
      - id: 5
        type: string
        name: manual_fan_mode
        hidden: true  # control via fan_mode
      - id: 7
        type: boolean
        name: fan_mode
        mapping:
          - dps_val: true
            value: auto
          - dps_val: false
            constraint: manual_fan_mode
            conditions:
              - dps_val: "0"
                value: "off"
                hidden: true
              - dps_val: "1"
                value: quiet
              - dps_val: "2"
                value: low
              - dps_val: "3"
                value: medlow
              - dps_val: "4"
                value: medium
              - dps_val: "5"
                value: medhigh
              - dps_val: "6"
                value: high
              - dps_val: "7"
                value: turbo
      - id: 8
        type: boolean
        name: preset_mode
        optional: true
        mapping:
          - dps_val: false
            value: comfort
          - dps_val: true
            value: eco
          - value_redirect: ai_eco
      - id: 111
        type: boolean
        name: ai_eco
        optional: true
        hidden: true  # control via above
        mapping:
          - dps_val: false
            value: comfort
          - dps_val: true
            value: eco
      - id: 124
        type: string
        name: ai_eco_status
        optional: true
        mapping:
          - dps_val: "0"
            value: "off"
          - dps_val: "1"
            value: "AI eco frequency modulation"
          - dps_val: "2"
            value: "AI eco PID"
      - id: 113
        type: integer
        name: max_temperature
        mapping:
          - scale: 100
      - id: 114
        type: integer
        name: min_temperature
        mapping:
          - scale: 100
      - id: 24
        type: integer
        name: temp_set_f
        optional: true
      - id: 31
        type: string
        name: swing_mode
        mapping:
          - dps_val: "1"
            value: "on"
          - dps_val: "2"
            value: upper_half
          - dps_val: "3"
            value: lower_half
          - dps_val: "6"
            value: surround
            hidden: true  # not offered by the manufacturer app for this model
          - dps_val: "8"
            value: "off"
          - dps_val: "9"
            value: topmost
          - dps_val: "10"
            value: top
          - dps_val: "11"
            value: middle
          - dps_val: "12"
            value: down
          - dps_val: "13"
            value: downmost
      - id: 34
        type: string
        name: swing_horizontal_mode
        mapping:
          - dps_val: "1"
            value: "on"
          - dps_val: "2"
            value: left_swing
          - dps_val: "3"
            value: center_swing
          - dps_val: "4"
            value: right_swing
          - dps_val: "5"
            value: direct
            hidden: true  # not offered by the manufacturer app for this model
          - dps_val: "8"
            value: "off"
          - dps_val: "9"
            value: leftmost
          - dps_val: "10"
            value: left
          - dps_val: "11"
            value: center
          - dps_val: "12"
            value: right
          - dps_val: "13"
            value: rightmost
          - dps_val: "17"
            value: surround
            hidden: true  # not offered by the manufacturer app for this model

  - entity: button
    name: Turbo
    icon: "mdi:fan-speed-3"
    category: config
    dps:
      - id: 5
        type: string
        name: button
        mapping:
          - dps_val: "7"
            value: true

  - entity: switch
    name: iAIR (anti-mildew)
    icon: mdi:bacteria-outline
    category: config
    dps:
      - id: 9
        type: boolean
        name: switch

  - entity: switch
    name: Emergency heat
    category: config
    hidden: unavailable
    dps:
      - id: 12
        type: boolean
        optional: true
        name: switch
      - id: 12
        type: boolean
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true

  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 13
        type: boolean
        name: switch
        mapping:
          - dps_val: true
            icon: "mdi:lightbulb-off"
          - dps_val: false
            icon: "mdi:lightbulb-on"

  - entity: switch
    name: Mute
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch
        mapping:
          - dps_val: false
            value: true
            icon: "mdi:volume-off"
          - dps_val: true
            value: false
            icon: "mdi:volume-high"

  - entity: switch
    translation_key: uv_sterilization
    category: config
    hidden: unavailable  # not available on this model
    dps:
      - id: 26
        type: boolean
        name: switch
      - id: 26
        type: boolean
        name: available
        mapping:
          - value: false

  - entity: switch
    name: iClean (evaporator self-clean)
    icon: mdi:broom
    category: config
    dps:
      - id: 27
        type: boolean
        name: switch
      - id: 1
        name: available
        type: boolean
        hidden: true
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true

  - entity: fan
    translation_key: ventilation
    category: config
    hidden: unavailable  # hidden unless the device actually reports this dp
    dps:
      - id: 39
        type: boolean
        optional: true
        name: switch
      - id: 40
        type: string
        optional: true
        name: speed
        mapping:
          - dps_val: "0"
            value: 0
          - dps_val: "1"
            value: 33
          - dps_val: "2"
            value: 66
          - dps_val: "3"
            value: 100
      - id: 39
        type: boolean
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true

  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 101
        type: boolean
        name: option
        mapping:
          - dps_val: false
            value: celsius
          - dps_val: true
            value: fahrenheit

  - entity: switch
    name: SMART 8°C
    icon: "mdi:heat-wave"
    category: config
    dps:
      - id: 102
        type: boolean
        name: switch

  - entity: binary_sensor
    name: Aux heat
    class: running
    category: diagnostic
    hidden: unavailable  # not available on this model
    dps:
      - id: 103
        type: boolean
        name: sensor
      - id: 103
        type: boolean
        name: available
        mapping:
          - value: false

  - entity: switch
    name: Hot wind
    category: config
    hidden: unavailable  # not available on this model
    dps:
      - id: 104
        type: boolean
        name: switch
      - id: 104
        type: boolean
        name: available
        mapping:
          - value: false

  - entity: switch
    name: Cool wind
    category: config
    hidden: unavailable  # not available on this model
    dps:
      - id: 105
        type: boolean
        name: switch
      - id: 105
        type: boolean
        name: available
        mapping:
          - value: false

  - entity: text
    name: Week timer 1
    category: config
    icon: "mdi:calendar-clock"
    hidden: true  # advanced: need to understand format to use
    dps:
      - id: 107
        type: string
        optional: true
        name: value

  - entity: text
    name: Week timer 2
    category: config
    icon: "mdi:calendar-clock"
    hidden: true  # advanced: need to understand format to use
    dps:
      - id: 109
        type: string
        optional: true
        name: value

  - entity: binary_sensor
    name: Filter blocked
    class: problem
    category: diagnostic
    dps:
      - id: 110
        type: boolean
        name: sensor

  - entity: sensor
    translation_key: ambient_temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 116
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 100

  - entity: sensor
    name: Outdoor fan speed
    icon: "mdi:fan"
    category: diagnostic
    dps:
      - id: 117
        type: integer
        name: sensor
        unit: rpm
        class: measurement
      - id: 118
        type: integer
        name: target
        mapping:
          - scale: 0.1

  - entity: sensor
    name: Compressor frequency
    class: frequency
    category: diagnostic
    dps:
      - id: 119
        type: integer
        name: sensor
        unit: Hz
        class: measurement
      - id: 120
        type: integer
        name: target
      - id: 121
        type: integer
        name: set_frequency
      - id: 122
        type: integer
        name: eev_opening

  - entity: switch
    name: Soft wind
    category: config
    hidden: unavailable  # hidden unless the device actually reports this dp
    dps:
      - id: 123
        type: string
        optional: true
        name: switch
        mapping:
          - dps_val: "0"
            value: false
          - dps_val: "1"
            value: true
          - value: true
            hidden: true
      - id: 123
        type: string
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true

  - entity: select
    name: Reporting mode
    icon: "mdi:invoice-text-send"
    category: config
    dps:
      - id: 125
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: "On mode change"
          - dps_val: "1"
            value: "Hourly"
          - dps_val: "2"
            value: "Cloud pull"

  - entity: select
    name: Sleep mode
    icon: "mdi:sleep"
    category: config
    dps:
      - id: 126
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: "off"
            constraint: mode
            conditions:
              - dps_val: ["0", "2", "3", "4"]
                invalid: true
          - dps_val: "1"
            value: standard
            constraint: mode
            conditions:
              - dps_val: ["0", "2", "3", "4"]
                invalid: true
          - dps_val: "2"
            value: elderly
            constraint: mode
            conditions:
              - dps_val: ["0", "2", "3", "4"]
                invalid: true
          - dps_val: "3"
            value: child
            constraint: mode
            conditions:
              - dps_val: ["0", "2", "3", "4"]
                invalid: true
      - id: 4
        name: mode
        type: string
        hidden: true

  - entity: select
    name: Generator mode
    icon: "mdi:solar-power-variant"
    category: config
    dps:
      - id: 132
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: disabled
          - dps_val: "1"
            value: LV1
          - dps_val: "2"
            value: LV2
          - dps_val: "3"
            value: LV3

  - entity: binary_sensor
    class: problem
    category: diagnostic
    hidden: unavailable
    dps:
      - id: 134
        type: base64
        optional: true
        name: sensor
        mapping:
          - dps_val: ""
            value: false
          - dps_val: AA==
            value: false
          - dps_val: AAAA
            value: false
          - dps_val: AAAAAAAA
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 134
        type: base64
        optional: true
        name: fault_code
      - id: 134
        type: base64
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true

  - entity: switch
    name: Vertical swing
    icon: mdi:pan-vertical
    category: config
    hidden: true  # duplicates dp 31 but in more simplistic way
    dps:
      - id: 137
        type: string
        name: switch
        mapping:
          - dps_val: "0"
            value: false
          - dps_val: "1"
            value: true

  - entity: switch
    name: Horizontal swing
    icon: mdi:pan-horizontal
    category: config
    hidden: true  # duplicates dp 34 but in more simplistic way
    dps:
      - id: 138
        type: string
        name: switch
        mapping:
          - dps_val: "0"
            value: false
          - dps_val: "1"
            value: true
